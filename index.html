<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./Photos/payoo.png" />
    <title>Payoo Mobile Bank</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body
    class="bg-[#f4f5f7] min-h-screen opacity-100 flex flex-col items-center justify-center px-4 py-8"
  >
    <div
      class="h-[120px] sm:h-[150px] w-72 sm:w-80 bg-[url(./Photos/bg.png)] bg-cover flex flex-col items-center justify-center mb-1"
    >
      <img
        src="./Photos/Group.png"
        alt="Payoo Logo"
        class="max-w-full h-auto"
      />
    </div>

    <!-- Login Form -->
    <form
      class="w-full max-w-sm mx-auto p-6 sm:p-8 md:p-10 border-2 border-[#e0e0e0] rounded-lg shadow-lg bg-[#ffffff] opacity-100"
    >
      <div class="space-y-4">
        <div>
          <label
            for="phoneNumber"
            class="block text-sm font-medium text-gray-700 mb-2"
            >Mobile Number</label
          >
          <input
            type="text"
            id="phone-number"
            placeholder="Enter your mobile number"
            class="input input-bordered w-full bg-[#f4f5f7] opacity-100 rounded-[32px] text-sm sm:text-base"
          />
        </div>
        <div>
          <label for="pin" class="block text-sm font-medium text-gray-700 mb-2"
            >4-Digit PIN</label
          >
          <input
            type="password"
            id="pin"
            placeholder="Enter your 4-digit PIN"
            class="input input-bordered w-full bg-[#f4f5f7] opacity-100 rounded-[32px] text-sm sm:text-base"
          />
        </div>

        <button
          type="submit"
          class="btn w-full bg-[#0874f2] hover:bg-[#0666d9] rounded-[32px] text-[#ffffff] mt-6 py-3 text-sm sm:text-base font-medium transition-colors duration-200"
          id="log-in-btn"
        >
          Login
        </button>
      </div>
    </form>

    <script src="./index.js"></script>
  </body>
</html>
